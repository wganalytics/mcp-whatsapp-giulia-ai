[project]
name = "prj-06-cap07-whatsapp"
version = "0.1.0"
description = "Servidor MCP de WhatsApp via Evolution API (grupos, histórico, envio) — Cap. 7 do livro MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "mcp[cli]>=1.28.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
